# Tema del tablero Convite: paleta «Camino abierto» (recursos/marca/README.md) y tipografía Ancízar.
# Ancízar es la familia institucional de la UNAL, con licencia SIL OFL 1.1 (tablero/static/OFL-Ancizar.txt).
# Se sirve desde tablero/static, así que no depende de internet; si no carga, queda la sans-serif del sistema.
[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1F5C4A"                 # verde monte
backgroundColor = "#F6F4EA"              # cal
secondaryBackgroundColor = "#E4EADB"     # niebla
textColor = "#1C2A24"                    # monte oscuro
borderColor = "#CBD6C4"
font = "AncizarSans, sans-serif"
headingFont = "AncizarSans, sans-serif"
baseRadius = "14px"
showWidgetBorder = true
dataframeBorderColor = "#CBD6C4"
dataframeHeaderBackgroundColor = "#E4EADB"   # niebla
dataframeHeaderTextColor = "#5C6A62"     # piedra: encabezados discretos

[[theme.fontFaces]]
family = "AncizarSans"
url = "app/static/AncizarSans-VF.ttf"
style = "normal"
weight = "100 900"

[[theme.fontFaces]]
family = "AncizarSans"
url = "app/static/AncizarSans-Italic-VF.ttf"
style = "italic"
weight = "100 900"
